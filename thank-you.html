<!-- thank-you.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vielen Dank – Yeli & Joni</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .lang-switch { position: absolute; top: 20px; right: 100px; z-index: 10; }
    .swiss-logo { position: absolute; top: 18px; right: 20px; height: 36px; width: auto; z-index: 10; }
  </style>
  <script>
    // Sprachumschaltung wie auf den anderen Seiten
    let currentLang = 'de';
    function switchLanguage(lang){
      currentLang = lang;
      document.querySelectorAll('[data-de]').forEach(el=>{
        el.textContent = currentLang==='de' ? el.getAttribute('data-de') : el.getAttribute('data-en');
      });
      document.querySelectorAll('[data-de-placeholder]').forEach(el=>{
        el.placeholder = currentLang==='de' ? el.getAttribute('data-de-placeholder') : el.getAttribute('data-en-placeholder');
      });
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      // optional: Sprache aus URL ?lang=en übernehmen
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang');
      if (lang === 'en') {
        const sel = document.getElementById('langSelect');
        if (sel) sel.value = 'en';
        switchLanguage('en');
      }
    });
  </script>
</head>
<body class="bg-gradient-to-b from-white to-gray-50 text-gray-800 font-sans min-h-screen">

  <!-- Swiss-Logo + Sprachumschalter -->
  <img src="images/swiss-logo.png" alt="Swiss Logo" class="swiss-logo" onerror="this.style.display='none';" />
  <div class="lang-switch">
    <select id="langSelect" onchange="switchLanguage(this.value)" class="border border-gray-300 bg-white px-3 py-1 rounded shadow-sm">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>
  </div>

  <!-- Header (wie auf den anderen Seiten) -->
  <header class="text-center py-12 bg-white shadow-sm border-b border-red-200">
    <h1 class="text-5xl font-light tracking-wide mb-3 text-red-700 flex justify-center items-center gap-3">
      <span data-de="Yeli & Joni" data-en="Yeli & Joni">Yeli & Joni</span>
      <img src="images/icon.png" alt="Flugzeug Icon" class="h-8 w-8 object-contain" />
    </h1>
    <p class="text-sm uppercase tracking-wide text-gray-500" data-de="September XX 2026 · Schaffhausen, Schweiz" data-en="September XX 2026 · Schaffhausen, Switzerland">
      September XX 2026 · Schaffhausen, Schweiz
    </p>
  </header>

  <!-- Danke-Content -->
  <main class="max-w-3xl mx-auto px-6">
    <section class="mt-10 bg-white rounded-2xl shadow p-8 border border-gray-200 text-center">
      <div class="mx-auto mb-5 w-16 h-16 rounded-full bg-red-50 flex items-center justify-center border border-red-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-red-600" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M9 12.75 7.25 11l-1.5 1.5L9 15.25l9-9L16.5 4l-7.5 7.5Z"/>
        </svg>
      </div>

      <h2 class="text-3xl font-light text-red-700 mb-2" data-de="Vielen Dank für die Rückmeldung!" data-en="Thank you for your response!">
        Vielen Dank für die Rückmeldung!
      </h2>
      <p class="text-gray-600 mb-6" data-de="Wir freuen uns, dich an unserem besonderen Tag zu sehen." data-en="We look forward to seeing you on our special day.">
        Wir freuen uns, dich an unserem besonderen Tag zu sehen.
      </p>

      <a href="index.html"
         class="inline-block bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg transition">
        <span data-de="Zurück zur Hauptseite" data-en="Back to Home">Zurück zur Hauptseite</span>
      </a>
    </section>

    <!-- Optional: kleine Info-Zeile -->
    <p class="text-center text-xs text-gray-400 mt-6" data-de="Du kannst dieses Fenster nun schließen." data-en="You can now close this window.">
      Du kannst dieses Fenster nun schließen.
    </p>
  </main>

</body>
</html>
