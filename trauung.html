    .slideshow-container { position: relative; width: 100%; max-width: 700px; margin: 2rem auto; overflow: hidden; border-radius: 1rem; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
    .slide { width: 100%; height: 350px; object-fit: cover; display: none; border-radius: 1rem; }
	
	/* Mobile tab bar: Scrollbar verstecken für iOS/Android/Webkit/Firefox */
	.no-scrollbar::-webkit-scrollbar { display: none; }
	.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
	
	/* Startzustand: leicht transparent & nach unten versetzt */
	.timeline-card {
	  opacity: 0;
	  transition: opacity 2s ease;
	}

	/* Sobald sichtbar */
	.timeline-card.visible {
	  opacity: 1;
	}
  </style>

<script>
  let currentLang = 'de';
  let slideIndex = 0;

  function switchLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-de]').forEach(el => {
      el.textContent = currentLang === 'de'
        ? el.getAttribute('data-de')
        : el.getAttribute('data-en');
    });
    document.querySelectorAll('[data-de-placeholder]').forEach(el => {
      el.placeholder = currentLang === 'de'
        ? el.getAttribute('data-de-placeholder')
        : el.getAttribute('data-en-placeholder');
    });
  }

  function toggleAllergies() {
    const allergyBox = document.getElementById('allergyBox');
    allergyBox.style.display = document.getElementById('allergyCheck').checked ? 'inline-block' : 'none';
  }

  function copyText(elementId) {
    const el = document.getElementById(elementId);
    const text = el.innerText.trim();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(() => alert("Kopiert: " + text))
        .catch(() => alert("Fehler beim Kopieren"));
    } else {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        alert("Kopiert: " + text);
      } catch {
        alert("Fehler beim Kopieren");
      }
      document.body.removeChild(textarea);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    // optional: Sprache initial anwenden
    switchLanguage('de');
  });
</script>

<script>
  function openTab(evt, tabName) {
    // Alle Inhalte ausblenden
    document.querySelectorAll(".tabcontent").forEach(tab => {
      tab.classList.add("hidden");
    });

    // Ziel-Section sichtbar machen
    const activeSection = document.getElementById(tabName);
    if (activeSection) {
      activeSection.classList.remove("hidden");
    }

    // Alle Tab-Buttons auf "inaktiv" setzen
    document.querySelectorAll(".tablink").forEach(btn => {
      btn.classList.remove(
        "bg-green-600",
        "text-white",
        "md:text-green-600",
        "border-green-600"
      );
      btn.classList.add(
        "bg-gray-100",
        "text-gray-600",
        "md:bg-transparent",
        "md:text-gray-700",
        "border-transparent"
      );
    });

    // Geklickten Button aktiv stylen
    const clicked = evt.currentTarget;
    clicked.classList.remove(
      "bg-gray-100",
      "text-gray-600",
      "md:bg-transparent",
      "md:text-gray-700",
      "border-transparent"
    );
    clicked.classList.add(
      "bg-green-600",
      "text-white",
      "md:bg-transparent",
      "md:text-green-600",
      "border-green-600"
    );

    // Dynamischen Inhalt laden (aber Check-In ist statisch, also auslassen)
    if (tabName !== "rsvp") {
      injectTabContent(tabName, tabName);
    }
  }

document.addEventListener("DOMContentLoaded", () => {

});
</script>
