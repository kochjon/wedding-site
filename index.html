    .slideshow-container { position: relative; width: 100%; max-width: 700px; margin: 2rem auto; overflow: hidden; border-radius: 1rem; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
    .slide { width: 100%; height: 350px; object-fit: cover; display: none; border-radius: 1rem; }
	
	/* Mobile tab bar: Scrollbar verstecken für iOS/Android/Webkit/Firefox */
	.no-scrollbar::-webkit-scrollbar { display: none; }
	.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
	
	/* Startzustand: leicht transparent & nach unten versetzt */
	.timeline-card {
	  opacity: 0;
	  transform: translateY(30px);
	  transition: opacity 0.8s ease, transform 0.8s ease;
	}

	/* Sobald sichtbar */
	.timeline-card.visible {
	  opacity: 1;
	  transform: translateY(0);
	}
  </style>

  <script>
    let currentLang = 'de';
    let slideIndex = 0;
	
	 

	  // Geklickten Tab "aktiv" stylen
	  const clicked = evt.currentTarget;

	  // erst inaktive Klassen beim aktiven Button entfernen
	  clicked.classList.remove(
		"bg-gray-100",
		"text-gray-600",
		"md:bg-transparent",
		"md:text-gray-700",
		"border-transparent"
	  );

	  // dann aktive Klassen hinzufügen
	  clicked.classList.add(
		// Mobile aktiv:
		"bg-red-600",
		"text-white",
		// Desktop aktiv:
		"md:bg-transparent",
		"md:text-red-600",
		// Unterstreichung unten für Desktop (und ok für Mobile)
		"border-red-600"
	  );
	}

    function switchLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-de]').forEach(el => {
        el.textContent = currentLang === 'de' ? el.getAttribute('data-de') : el.getAttribute('data-en');
      });
      document.querySelectorAll('[data-de-placeholder]').forEach(el => {
        el.placeholder = currentLang === 'de' ? el.getAttribute('data-de-placeholder') : el.getAttribute('data-en-placeholder');
      });
    }

    function toggleAllergies() {
      const allergyBox = document.getElementById('allergyBox');
      allergyBox.style.display = document.getElementById('allergyCheck').checked ? 'inline-block' : 'none';
    }

	function copyText(elementId) {
	  const el = document.getElementById(elementId);
	  const text = el.innerText.trim();

	  // Moderne Clipboard API mit Fallback
	  if (navigator.clipboard && window.isSecureContext) {
		navigator.clipboard.writeText(text)
		  .then(() => alert("Kopiert: " + text))
		  .catch(() => alert("Fehler beim Kopieren"));
	  } else {
		// Fallback für ältere Browser
		const textarea = document.createElement("textarea");
		textarea.value = text;
		document.body.appendChild(textarea);
		textarea.select();
		try {
		  document.execCommand("copy");
		  alert("Kopiert: " + text);
		} catch {
		  alert("Fehler beim Kopieren");
		}
		document.body.removeChild(textarea);
	  }
	}

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".tablink").click();
      //loadSlideshowImages();
    });
  </script>



<script>
// --- Restart-Funktion für den Fade-in bei Tab-Wechsel ---
	function resetTimelineAnimation() {
	  if (!cards.length) return;

	  // Sichtbarkeit zurücksetzen
	  cards.forEach(card => card.classList.remove("visible"));

	  // Kleines Delay, um CSS-Rücksetzung wirken zu lassen
	  setTimeout(() => {
		// Neue Observer-Instanz, um Animation erneut auszulösen
		const observer = new IntersectionObserver(
		  (entries) => {
			entries.forEach((entry) => {
			  if (entry.isIntersecting) {
				entry.target.classList.add("visible");
				observer.unobserve(entry.target);
			  }
			});
		  },
		  { threshold: 0.2 }
		);
		cards.forEach(card => observer.observe(card));
	  }, 100);
	}
</script>

<script>
  function openTab(evt, tabName) {
    // Alle Inhalte ausblenden
    document.querySelectorAll(".tabcontent").forEach(tab => {
      tab.classList.add("hidden");
    });

    // Gewählten Inhalt anzeigen
    const activeSection = document.getElementById(tabName);
    if (activeSection) {
      activeSection.classList.remove("hidden");
    }

    // Alle Tabs zurück in "inaktiv"-Zustand
    document.querySelectorAll(".tablink").forEach(btn => {
      btn.classList.remove(
        "bg-red-600",
        "text-white",
        "md:text-red-600",
        "border-red-600"
      );
      btn.classList.add(
        "bg-gray-100",
        "text-gray-600",
        "md:bg-transparent",
        "md:text-gray-700",
        "border-transparent"
      );
    });

    // Aktuellen Button aktiv stylen
    const clicked = evt.currentTarget;
    clicked.classList.remove(
      "bg-gray-100",
      "text-gray-600",
      "md:bg-transparent",
      "md:text-gray-700",
      "border-transparent"
    );
    clicked.classList.add(
      "bg-red-600",
      "text-white",
      "md:bg-transparent",
      "md:text-red-600",
      "border-red-600"
    );

    // Dynamisch laden, außer rsvp (das ist statisch im HTML)
    if (tabName !== "rsvp") {
      injectTabContent(tabName, tabName);
    }
  }

  // Seite starten
  document.addEventListener("DOMContentLoaded", () => {
    const firstBtn = document.querySelector(".tablink");
    if (firstBtn) {
      firstBtn.click(); // das löst openTab aus, und DAMIT auch injectTabContent für "geschichte"
    }
  });
</script>
